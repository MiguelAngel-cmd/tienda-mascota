# Avance - Fases 1 a 4: Product, Customer, Inventory y Sales Service, cada uno con su base de datos.
# Uso:  docker compose up --build -d
services:
  postgres-products:
    image: postgres:16
    container_name: postgres-products
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres-products-data:/var/lib/postgresql/data
    networks:
      - tienda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build: ./product-service
    container_name: product-service
    environment:
      DB_URL: jdbc:postgresql://postgres-products:5432/products_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8081:8081"
    depends_on:
      postgres-products:
        condition: service_healthy
    networks:
      - tienda-net

  postgres-customers:
    image: postgres:16
    container_name: postgres-customers
    environment:
      POSTGRES_DB: customers_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres-customers-data:/var/lib/postgresql/data
    networks:
      - tienda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d customers_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  customer-service:
    build: ./customer-service
    container_name: customer-service
    environment:
      DB_URL: jdbc:postgresql://postgres-customers:5432/customers_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8082:8082"
    depends_on:
      postgres-customers:
        condition: service_healthy
    networks:
      - tienda-net

  postgres-inventory:
    image: postgres:16
    container_name: postgres-inventory
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    networks:
      - tienda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    environment:
      DB_URL: jdbc:postgresql://postgres-inventory:5432/inventory_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PRODUCT_SERVICE_URL: http://product-service:8081   # nombre del servicio = nombre DNS dentro de la red
    ports:
      - "8083:8083"
    depends_on:
      postgres-inventory:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - tienda-net

  postgres-sales:
    image: postgres:16
    container_name: postgres-sales
    environment:
      POSTGRES_DB: sales_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5436:5432"
    volumes:
      - postgres-sales-data:/var/lib/postgresql/data
    networks:
      - tienda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d sales_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  sales-service:
    build: ./sales-service
    container_name: sales-service
    environment:
      DB_URL: jdbc:postgresql://postgres-sales:5432/sales_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8083
    ports:
      - "8084:8084"
    depends_on:
      postgres-sales:
        condition: service_healthy
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
    networks:
      - tienda-net

networks:
  tienda-net:
volumes:
  postgres-products-data:
  postgres-customers-data:
  postgres-inventory-data:
  postgres-sales-data:
