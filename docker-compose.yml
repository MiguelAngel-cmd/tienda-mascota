# Fase 5 - Despliegue completo: 4 microservicios + 4 bases de datos + frontend (nginx).
# Uso:  docker compose up --build -d      ->  abrir http://localhost:8080
# Cada servicio espera a que sus dependencias estén "healthy" (actuator/health) antes de arrancar.
services:
  postgres-products:
    image: postgres:16
    container_name: postgres-products
    restart: unless-stopped
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres-products-data:/var/lib/postgresql/data
    networks:
      - tienda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build: ./product-service
    container_name: product-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-products:5432/products_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8081:8081"
    depends_on:
      postgres-products:
        condition: service_healthy
    networks:
      - tienda-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  postgres-customers:
    image: postgres:16
    container_name: postgres-customers
    restart: unless-stopped
    environment:
      POSTGRES_DB: customers_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres-customers-data:/var/lib/postgresql/data
    networks:
      - tienda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d customers_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  customer-service:
    build: ./customer-service
    container_name: customer-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-customers:5432/customers_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8082:8082"
    depends_on:
      postgres-customers:
        condition: service_healthy
    networks:
      - tienda-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  postgres-inventory:
    image: postgres:16
    container_name: postgres-inventory
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    networks:
      - tienda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-inventory:5432/inventory_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PRODUCT_SERVICE_URL: http://product-service:8081   # nombre del servicio = nombre DNS dentro de la red
    ports:
      - "8083:8083"
    depends_on:
      postgres-inventory:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - tienda-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  postgres-sales:
    image: postgres:16
    container_name: postgres-sales
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5436:5432"
    volumes:
      - postgres-sales-data:/var/lib/postgresql/data
    networks:
      - tienda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d sales_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  sales-service:
    build: ./sales-service
    container_name: sales-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-sales:5432/sales_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8083
    ports:
      - "8084:8084"
    depends_on:
      postgres-sales:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    networks:
      - tienda-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  # Interfaz web: nginx sirve el frontend y hace de proxy hacia las APIs (/api/products -> product-service, ...)
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      product-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      sales-service:
        condition: service_healthy
    networks:
      - tienda-net

networks:
  tienda-net:
volumes:
  postgres-products-data:
  postgres-customers-data:
  postgres-inventory-data:
  postgres-sales-data:
