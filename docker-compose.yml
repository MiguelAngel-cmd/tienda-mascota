# Avance - Fases 1 y 2: Product-Service y Customer-Service, cada uno con su base de datos.
# Uso:  docker compose up --build -d
services:
  postgres-products:
    image: postgres:16
    container_name: postgres-products
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres-products-data:/var/lib/postgresql/data
    networks:
      - tienda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build: ./product-service
    container_name: product-service
    environment:
      DB_URL: jdbc:postgresql://postgres-products:5432/products_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8081:8081"
    depends_on:
      postgres-products:
        condition: service_healthy
    networks:
      - tienda-net

  postgres-customers:
    image: postgres:16
    container_name: postgres-customers
    environment:
      POSTGRES_DB: customers_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres-customers-data:/var/lib/postgresql/data
    networks:
      - tienda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d customers_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  customer-service:
    build: ./customer-service
    container_name: customer-service
    environment:
      DB_URL: jdbc:postgresql://postgres-customers:5432/customers_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8082:8082"
    depends_on:
      postgres-customers:
        condition: service_healthy
    networks:
      - tienda-net

networks:
  tienda-net:
volumes:
  postgres-products-data:
  postgres-customers-data:
