spring.application.name=inventory-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/inventory_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# URL del microservicio de productos (en Docker se sobrescribe con http://product-service:8081)
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}

# Swagger UI: http://localhost:8083/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Healthcheck (lo usa Docker Compose para saber cuándo el servicio está listo)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Orígenes permitidos por CORS (el frontend). Con Docker el frontend pasa por el proxy de nginx,
# así que esto solo hace falta cuando se abre el frontend directamente (modo H2 / desarrollo).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
