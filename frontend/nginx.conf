server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Proxy hacia cada microservicio (los nombres son los del docker-compose = DNS de la red interna)
    # /api/products/5  ->  http://product-service:8081/products/5
    location /api/products  { proxy_pass http://product-service:8081/products; }
    location /api/customers { proxy_pass http://customer-service:8082/customers; }
    location /api/inventory { proxy_pass http://inventory-service:8083/inventory; }
    location /api/sales     { proxy_pass http://sales-service:8084/sales; }

    # El JS y el CSS no se cachean, así un cambio se ve de inmediato al recargar
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
