<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huellitas · Gestión de la tienda</title>
  <meta name="description" content="Sistema de gestión para una tienda de mascotas: productos, clientes, inventario y ventas.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230f766e'%3E%3Ccircle cx='6' cy='9' r='2.2'/%3E%3Ccircle cx='10' cy='5' r='2.2'/%3E%3Ccircle cx='14' cy='5' r='2.2'/%3E%3Ccircle cx='18' cy='9' r='2.2'/%3E%3Cpath d='M12 11c-3 0-6 4-6 6.5C6 19 7.2 20 8.7 20c1.2 0 2-.6 3.3-.6s2.1.6 3.3.6c1.5 0 2.7-1 2.7-2.5C18 15 15 11 12 11z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Aplica el tema guardado antes de pintar, para que no "parpadee"
    try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <span class="brand-logo" data-icon="paw"></span>
        <span class="brand-text"><strong>Huellitas</strong><small>Tienda de mascotas</small></span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard"><span data-icon="home"></span>Resumen</a>
        <a href="#/ventas" data-route="ventas"><span data-icon="cart"></span>Ventas</a>
        <a href="#/productos" data-route="productos"><span data-icon="box"></span>Productos</a>
        <a href="#/inventario" data-route="inventario"><span data-icon="layers"></span>Inventario<span class="nav-badge" id="badge-alertas" hidden></span></a>
        <a href="#/clientes" data-route="clientes"><span data-icon="users"></span>Clientes</a>
      </nav>
      <div class="sidebar-footer">
        <div class="services" id="services" aria-label="Estado de los microservicios"></div>
        <button class="btn btn-ghost btn-sm theme-toggle" id="theme-toggle" type="button">
          <span data-icon="moon"></span><span>Modo oscuro</span>
        </button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button class="btn btn-icon btn-ghost menu-btn" id="menu-btn" type="button" aria-label="Abrir menú"><span data-icon="menu"></span></button>
        <span class="topbar-brand"><span data-icon="paw"></span>Huellitas</span>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
