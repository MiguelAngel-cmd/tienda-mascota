spring.application.name=product-service
server.port=8081

# Conexión a PostgreSQL (variables de entorno con valores por defecto para desarrollo local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/products_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate crea/actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Swagger UI: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
