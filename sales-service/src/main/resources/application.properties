spring.application.name=sales-service
server.port=8084

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/sales_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# URLs de los otros microservicios (en Docker se sobrescriben con http://<nombre-del-servicio>:<puerto>)
customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8082}
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8083}

# Swagger UI: http://localhost:8084/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Healthcheck (lo usa Docker Compose para saber cuándo el servicio está listo)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Orígenes permitidos por CORS (el frontend). Con Docker el frontend pasa por el proxy de nginx,
# así que esto solo hace falta cuando se abre el frontend directamente (modo H2 / desarrollo).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
